<div class="form-container">
  <h2>Product Form</h2>
  <form #productform="ngForm" (ngSubmit)="onsubmit(productform)">
    
    <!-- Name Field -->
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="Enter product name" required />
    </div>

    <!-- Price Field -->
    <div class="form-group">
      <label for="price">Price</label>
      <input type="number" id="price" name="price" [(ngModel)]="price" placeholder="Enter product price" required />
    </div>

    <!-- Description Field -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" [(ngModel)]="description" placeholder="Enter product description" rows="4"></textarea>
    </div>

    <!-- Color Pattern -->
    <div class="form-group">
      <label for="colorPattern">Color Pattern</label>
      <input 
        type="text" 
        id="colorPattern" 
        name="colorPattern" 
        [(ngModel)]="colorPattern" 
        placeholder="Enter color pattern (comma-separated, e.g., Red,Blue,Green)" 
      />
    </div>

    <!-- Is Customizable Field -->
    <div class="form-group">
      <label for="isCustomizable">Is Customizable</label>
      <select id="isCustomizable" name="isCustomizable" [(ngModel)]="isCustomizable" (change)="onCustomizableChange()">
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
    </div>

    <!-- Is Sleeve Field -->
    <div class="form-group">
      <label for="isSleeve">Is Sleeve Showable</label>
      <select id="isSleeve" name="isSleeve" [(ngModel)]="isSleeve">
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
    </div>

      <!-- Is color Field -->
      <div class="form-group">
        <label for="isColor">Is Color Showable</label>
        <select id="isColor" name="isColor" [(ngModel)]="isColor">
          <option value="true">True</option>
          <option value="false">False</option>
        </select>
      </div>

        <!-- Is size Field -->
    <div class="form-group">
      <label for="isSize">Is Size Showable</label>
      <select id="isSize" name="isSize" [(ngModel)]="isSize">
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
    </div>

    <!-- Category Field -->
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" [(ngModel)]="category">
        <option *ngFor="let cat of categoryList" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Subcategory Field -->
    <div class="form-group">
      <label for="subcategory">Subcategory</label>
      <select id="subcategory" name="subcategory" [(ngModel)]="subcategory">
        <option *ngFor="let cat of subcategoryList" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Stock Field -->
    <div class="form-group">
      <label for="stock">Stock</label>
      <input type="number" id="stock" name="stock" [(ngModel)]="stock" placeholder="Enter stock quantity" required />
    </div>

    <!-- Is Stock Showable Field -->
    <div class="form-group">
      <label for="isStock">Is Stock Showable</label>
      <select id="isStock" name="isStock" [(ngModel)]="isStock">
        <option value="true">True</option>
        <option value="false">False</option>
      </select>
    </div>

    <!-- Video URL Field -->
    <div class="form-group">
      <label for="vedioUrl">Video URL</label>
      <textarea id="vedioUrl" name="vedioUrl" [(ngModel)]="vedioUrl" placeholder="Enter video URL" rows="4" ></textarea>
    </div>

    <!-- Size Selection Field -->
    <div class="form-group">
      <label for="sizes">Sizes</label>
      <div *ngFor="let size of sizeOptions">
        <input 
          type="checkbox" 
          id="size-{{size}}" 
          name="sizes" 
          [(ngModel)]="selectedSizes[size]" 
          (change)="onSizeChange(size)" 
        />
        <label for="size-{{size}}">{{ size }}</label>
      </div>
    </div>

    <!-- Image Upload Field -->
    <div class="form-group">
      <label for="files">Upload or Capture Image</label>
      <input 
        type="file" 
        (change)="onFilesselected($event)"
        id="files" 
        name="files[]"
        multiple
        [(ngModel)]="files"
      />
      <div *ngIf="selectedFiles.length > 0">
        <ul>
          <li *ngFor="let file of selectedFiles; let i = index">
            {{ i + 1 }}. Selected File: {{ file.name }}
            <span class="delete-icon" (click)="removefile(i)">&#x2715;</span>
          </li>
        </ul>
      </div>
      <!-- Preview Section -->
      <div class="image-preview">
        <img id="imagePreview" src="" alt="Image Preview" />
      </div>
    </div>

    <!-- Submit Button -->
    <div class="form-group">
      <button #submitBtn type="submit" class="submit-btn" [disabled]="viewMode">Submit</button>
    </div>
  </form>
</div>
